name: Publish Without Permission
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [without-permission-publish]
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: without-permission-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          WP_EXPORT_TOKEN: ${{ secrets.WP_EXPORT_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
