name: Publish Without Permission
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [without-permission-publish]
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: without-permission-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          WP_EXPORT_TOKEN: ${{ secrets.WP_EXPORT_TOKEN }}
          WP_PUBLIC_REGISTRATION: ${{ vars.WP_PUBLIC_REGISTRATION }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Verify archive and protected desk export
        run: node tools/verify-dist.mjs
      - uses: actions/upload-artifact@v4
        if: vars.WP_ENABLE_PAGES_DEPLOY != 'true'
        with:
          name: verified-pages-build
          path: dist
          include-hidden-files: true
          retention-days: 3
      - uses: actions/configure-pages@v5
        if: vars.WP_ENABLE_PAGES_DEPLOY == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.WP_ENABLE_PAGES_DEPLOY == 'true'
        with:
          path: dist
  deploy:
    if: vars.WP_ENABLE_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke-test deployed website and editorial desk
        run: node tools/smoke-live.mjs
        env:
          WP_SITE_URL: ${{ vars.WP_SITE_URL }}
